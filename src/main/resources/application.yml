server:
  port: ${PORT:8081}
spring:
  application:
    name: contextflow
  jackson:
    default-property-inclusion: always
contextflow:
  timeout-ms: ${CONTEXTFLOW_TIMEOUT_MS:120000}
  network-timeout-ms: ${MODEL_NETWORK_TIMEOUT_MS:90000}
  retrieval:
    mode: ${RETRIEVAL_MODE:fixed-evidence}
  corpus-path: ${CORPUS_PATH:}
  evaluation-path: ${EVALUATION_PATH:}
  case-recall:
    enabled: ${CASE_RECALL_ENABLED:true}
    path: ${CASE_RECALL_PATH:}
  index:
    max-embedding-calls: ${INDEX_MAX_EMBEDDING_CALLS:100}
  llm:
    enabled: ${LLM_ENABLED:true}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    max-tokens: ${LLM_MAX_TOKENS:2000}
  vector:
    enabled: ${VECTOR_ENABLED:false}
    jdbc-url: ${VECTOR_JDBC_URL:jdbc:postgresql://localhost:5432/contextflow}
    username: ${VECTOR_USERNAME:postgres}
    password: ${VECTOR_PASSWORD:}
    embedding-url: ${EMBEDDING_URL:https://api.openai.com/v1/embeddings}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
